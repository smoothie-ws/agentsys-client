name: Independent release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test -- --test-concurrency=1
      - run: npm pack
      - run: npm pack ./sdk
      - run: python -c "import shutil; shutil.make_archive('agentsys-client-static','zip','dist/client')"
      - run: gh release create "$GITHUB_REF_NAME" *.tgz *.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
